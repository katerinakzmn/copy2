# Copy this file to configs/real_openai.yaml locally.
# Set model IDs and API credentials only through environment variables.
# Do not put API keys in this file.

backend: openai
dataset: toy
seed: 20260905

policy:
  name: retry_then_escalate
  max_weak_attempts: 2
  max_strong_attempts: 1
  confidence_threshold: 0.50
  zero_progress_limit: 1

budget:
  max_total_iterations: 3
  max_episode_cost_usd: 0.10

openai:
  temperature: 0
  max_output_tokens: 600
  reviewer_max_output_tokens: 120
  feedback_max_characters: 2000

models:
  weak_env: OPENAI_WEAK_MODEL
  strong_env: OPENAI_STRONG_MODEL
  reviewer_env: OPENAI_REVIEW_MODEL

pricing_file: configs/pricing.yaml

logging:
  save_debug_log: true
  save_trajectory_log: true
  save_prompt_hash: true
  save_token_usage: true
  save_latency: true
  save_step_cost_usd: true
